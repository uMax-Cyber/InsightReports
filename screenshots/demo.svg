<svg width="800" height="280" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="280" fill="#1e1e2e" rx="8"/>
<rect width="800" height="30" fill="#181825" rx="8"><animate attributeName="opacity" values="1;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
<circle cx="20" cy="15" r="6" fill="#f38ba8"/><circle cx="40" cy="15" r="6" fill="#f9e2af"/><circle cx="60" cy="15" r="6" fill="#a6e3a1"/>
<text x="400" y="20" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12">InsightReports — Dark Reports</text>
<text x="15" y="55" fill="#a6e3a1" font-family="monospace" font-size="13" opacity="0">$ open report.html<animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="90" fill="#89b4fa" font-family="monospace" font-size="13" opacity="0">🎨 Dark theme | Animated SVG | No JS needed<animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="120" fill="#cdd6f4" font-family="monospace" font-size="13" opacity="0">📊 Stats cards (fadeUp)<animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="150" fill="#f9e2af" font-family="monospace" font-size="13" opacity="0">📈 Bar charts (grow)<animate attributeName="opacity" values="0;1" begin="2.8s" dur="0.4s" fill="freeze"/></text>
<text x="15" y="180" fill="#f9e2af" font-family="monospace" font-size="13" opacity="0">🔴 Problem viz (pulse) → ✅ Fix viz<animate attributeName="opacity" values="0;1" begin="3.6s" dur="0.4s" fill="freeze"/><animate attributeName="fill" values="#f9e2af;#f38ba8;#f9e2af" begin="4.1s" dur="1.6s" repeatCount="indefinite"/></text>
<text x="15" y="220" fill="#a6e3a1" font-family="monospace" font-size="13" opacity="0">✓ Completed successfully<animate attributeName="opacity" values="0;1" begin="4.5s" dur="0.4s" fill="freeze"/><animate attributeName="fill" values="#a6e3a1;#94e2d5;#a6e3a1" begin="5.0s" dur="1.4s" repeatCount="indefinite"/></text>
<rect x="15" y="207" width="10" height="16" fill="#a6e3a1" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="4.9s" dur="0.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" begin="5.1s" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
